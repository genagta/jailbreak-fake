        ctx.fillRect(0, 0, 512, 512);

        // Endorphin droplet emblem

        dropGrad.addColorStop(0, '#ff6b6b');
        dropGrad.addColorStop(0.5, '#e62e35');
        dropGrad.addColorStop(1, '#8c1519');

        ctx.beginPath();
        ctx.moveTo(256, 92);
        ctx.bezierCurveTo(256, 92, 378, 225, 378, 312);

        ctx.bezierCurveTo(189, 428, 134, 380, 134, 312);

    function ControlCenter({ isOpen, onClose, controlState, setControlState }) {
      const toggleKey = (key) => {
        setControlState((prev) => {
          const next = { ...prev, [key]: !prev[key] };
          if (key === 'airplane' && next.airplane) {
            next.wifi = false;
            next.bluetooth = false;
          }
          return next;
        });
      };

      const handleVerticalSlider = (e, key) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const pct = Math.max(0.08, Math.min(1, 1 - (clientY - rect.top) / rect.height));
        setControlState((prev) => ({ ...prev, [key]: Math.round(pct * 100) }));
      };

      if (!isOpen) return null;

      return (
        <div
          className="absolute inset-0 z-40 bg-black/55 backdrop-blur-2xl flex flex-col justify-between px-5 pt-14 pb-8 animate-fadeIn"
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
        >
          <div className="space-y-3.5 max-w-[360px] w-full mx-auto">
            {/* Top Connectivity + Media Grid */}
            <div className="grid grid-cols-2 gap-3.5">
              {/* 2x2 Connectivity Module */}
              <div className="bg-white/[0.12] backdrop-blur-xl border border-white/15 rounded-[26px] p-3.5 grid grid-cols-2 gap-3">
                <button
                  onClick={() => toggleKey('airplane')}
                  className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${
                    controlState.airplane ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/30' : 'bg-white/15 text-white'
                  }`}
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" />
                  </svg>
                </button>

                <button
                  onClick={() => toggleKey('cellular')}
                  className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${
                    controlState.cellular && !controlState.airplane ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30' : 'bg-white/15 text-white/60'
                  }`}
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2v20" />
                    <path d="M17 7l-5-5-5 5" />
                    <path d="M7 17l5 5 5-5" />
                  </svg>
                </button>

                <button
                  onClick={() => toggleKey('wifi')}
                  className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${
                    controlState.wifi ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/30' : 'bg-white/15 text-white/60'
                  }`}
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                    <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                    <line x1="12" y1="20" x2="12.01" y2="20" />
                  </svg>
                </button>

                <button
                  onClick={() => toggleKey('bluetooth')}
                  className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${
                    controlState.bluetooth ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/30' : 'bg-white/15 text-white/60'
                  }`}
                >
                  <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5" />
                  </svg>
                </button>
              </div>

              {/* Now Playing Widget */}
              <div className="bg-white/[0.12] backdrop-blur-xl border border-white/15 rounded-[26px] p-3.5 flex flex-col justify-between">
                <div className="text-center">
                  <div className="text-[11px] font-medium text-white/50">Музыка</div>
                  <div className="text-[13.5px] font-semibold text-white truncate mt-0.5">
                    {controlState.playing ? 'Midnight City' : 'Не воспроизводится'}
                  </div>
                </div>
                <div className="flex items-center justify-around text-white pt-2">
                  <button
                    onClick={() => setControlState((p) => ({ ...p, playing: false }))}
                    className="p-1.5 text-white/70 active:scale-90"
                  >
                    <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                      <polygon points="19 20 9 12 19 4 19 20" />
                      <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" strokeWidth="2" />
                    </svg>
                  </button>
                  <button
                    onClick={() => toggleKey('playing')}
                    className="p-1.5 text-white active:scale-90"
                  >
                    {controlState.playing ? (
                      <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16" rx="1" />
                        <rect x="14" y="4" width="4" height="16" rx="1" />
                      </svg>
                    ) : (
                      <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3" />
                      </svg>
                    )}
                  </button>
                  <button
                    onClick={() => setControlState((p) => ({ ...p, playing: true }))}
                    className="p-1.5 text-white/70 active:scale-90"
                  >
                    <svg className="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                      <polygon points="5 4 15 12 5 20 5 4" />
                      <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" strokeWidth="2" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            {/* Middle Row: Rotation Lock + Do Not Disturb + Vertical Brightness & Volume Sliders */}
            <div className="grid grid-cols-4 gap-3.5">
              <div className="col-span-2 grid grid-cols-2 gap-3.5">
                <button
                  onClick={() => toggleKey('rotationLock')}
                  className={`h-[72px] rounded-[22px] border border-white/15 flex flex-col items-center justify-center gap-1 transition-all ${
                    controlState.rotationLock ? 'bg-white text-rose-500' : 'bg-white/[0.12] text-white'
                  }`}
                >
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="7" y="11" width="10" height="8" rx="2" />
                    <path d="M9 11V8a3 3 0 0 1 6 0v3" />
                  </svg>
                </button>

                <button
                  onClick={() => toggleKey('dnd')}
                  className={`h-[72px] rounded-[22px] border border-white/15 flex flex-col items-center justify-center gap-1 transition-all ${
                    controlState.dnd ? 'bg-indigo-500 text-white' : 'bg-white/[0.12] text-white'
                  }`}
                >
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                  </svg>
                </button>

                {/* Flashlight Tile */}
                <button
                  onClick={() => toggleKey('flashlight')}
                  className={`h-[72px] rounded-[22px] border border-white/15 flex flex-col items-center justify-center gap-1 transition-all ${
                    controlState.flashlight ? 'bg-white text-sky-600 shadow-lg shadow-white/25' : 'bg-white/[0.12] text-white'
                  }`}
                >
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 6c0 2-2 2-2 4v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V10c0-2-2-2-2-4V2h12z" />
                    <line x1="6" y1="6" x2="18" y2="6" />
                  </svg>
                </button>

                {/* Low Power Mode Tile */}
                <button
                  onClick={() => toggleKey('lowPower')}
                  className={`h-[72px] rounded-[22px] border border-white/15 flex flex-col items-center justify-center gap-1 transition-all ${
                    controlState.lowPower ? 'bg-amber-400 text-black' : 'bg-white/[0.12] text-white'
                  }`}
                >
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="2" y="7" width="16" height="10" rx="2" />
                    <line x1="22" y1="11" x2="22" y2="13" />
                  </svg>
                </button>
              </div>

              {/* Brightness Slider */}
              <div
                onClick={(e) => handleVerticalSlider(e, 'brightness')}
                onTouchMove={(e) => handleVerticalSlider(e, 'brightness')}
                className="h-[158px] rounded-[24px] bg-white/[0.14] border border-white/15 overflow-hidden relative flex flex-col justify-end cursor-pointer"
              >
                <div
                  className="w-full bg-white transition-all duration-75"
                  style={{ height: `${controlState.brightness}%` }}
                />
                <div className="absolute inset-x-0 bottom-3.5 flex justify-center pointer-events-none">
                  <svg className="w-6 h-6 text-zinc-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                  </svg>

              </div>

              {/* Volume Slider */}
              <div
                onClick={(e) => handleVerticalSlider(e, 'volume')}
                onTouchMove={(e) => handleVerticalSlider(e, 'volume')}

                </div>

          </button>
        </div>

    function NotificationCenter({ isOpen, onClose, notifications, onClearAll, onLockPhone, timeStr, dateStr }) {
      if (!isOpen) return null;

      return (
        <div
          className="absolute inset-0 z-40 bg-black/65 backdrop-blur-2xl flex flex-col justify-between px-5 pt-14 pb-6"
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
        >
          <div className="w-full max-w-[360px] mx-auto flex-1 flex flex-col overflow-hidden">
            {/* Clock Header */}
            <div className="text-center mb-5">
              <div className="text-[14px] font-medium text-white/75 capitalize">{dateStr}</div>
              <div className="text-[56px] font-bold text-white leading-none tracking-tight mt-1">{timeStr}</div>
            </div>

            {/* Notification Header Row */}
            <div className="flex items-center justify-between mb-2.5 px-1">
              <span className="text-[15px] font-semibold text-white">Центр уведомлений</span>
              {notifications.length > 0 && (
                <button
                  onClick={onClearAll}
                  className="px-3 py-1 rounded-full bg-white/15 text-[12px] font-medium text-white/90 active:scale-95"

                  Очистить
                </button>

            </div>

            {/* Notification List */}
            <div className="scroll-area flex-1 space-y-2.5 pb-4">
              {notifications.length === 0 ? (
                <div className="h-40 flex flex-col items-center justify-center text-white/45 text-[14px]">
                  Нет новых уведомлений
                </div>
              ) : (
                notifications.map((n) => (
                  <div
                    key={n.id}
                    className="bg-white/[0.14] backdrop-blur-xl border border-white/15 rounded-[20px] p-3.5 flex items-start gap-3"

                    <div className="shrink-0 mt-0.5">

                        onClick={() => onCloseApp(appId)}

                    {/* App Preview Card */}

                    >

    /* =========================================================================

    function LockScreen({ timeStr, dateStr, notifications, controlState, setControlState, onUnlock, onOpenCamera }) {
      const [dragOffset, setDragOffset] = useState(0);
      const startYRef = useRef(null);

      const handleStart = (clientY) => {
        startYRef.current = clientY;
      };

      const handleMove = (clientY) => {
        if (startYRef.current === null) return;
        const delta = startYRef.current - clientY;
        if (delta > 0) {
          setDragOffset(Math.min(delta, 360));
        }
      };

      const handleEnd = () => {
        if (dragOffset > 95) {
          onUnlock();
        }
        setDragOffset(0);
        startYRef.current = null;
      };

      return (
        <div
          onTouchStart={(e) => handleStart(e.touches[0].clientY)}
          onTouchMove={(e) => handleMove(e.touches[0].clientY)}
          onTouchEnd={handleEnd}
          onMouseDown={(e) => handleStart(e.clientY)}
          onMouseMove={(e) => handleMove(e.clientY)}
          onMouseUp={handleEnd}
          style={{
            transform: `translateY(-${dragOffset * 0.65}px)`,
            opacity: Math.max(0.25, 1 - dragOffset / 420),
            transition: startYRef.current ? 'none' : 'transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease'

    /* =========================================================================

      const [screen, setScreen] = useState('home'); // 'home' | 'running' | 'verbose' | 'completed'
      const [activeModal, setActiveModal] = useState(null); // null | 'settings' | 'pm' | 'credits'
      const [progress, setProgress] = useState(0);
      const [steps, setSteps] = useState([]);

      const [elapsedTime, setElapsedTime] = useState('6.2s');
      const runningRef = useRef(false);

      const togglePM = (pmName) => {
        setSelectedPMs((prev) => {
          if (prev.includes(pmName)) {
            if (prev.length === 1) return prev; // Keep at least 1 selected
            return prev.filter((item) => item !== pmName);
          }
          return [...prev, pmName];
        });
      };

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const startJailbreak = async () => {
        if (runningRef.current) return;
        runningRef.current = true;
        const t0 = performance.now();

        setScreen('running');
        setProgress(0);
        setSteps([]);

        const stageList = [
          { text: 'Initializing environment...', pct: 14, delay: 650 },
          { text: 'Checking device compatibility...', pct: 28, delay: 700 },
          { text: 'Exploiting kernel read/write (simulated)...', pct: 46, delay: 850 },
          { text: 'Bypassing PAC & PPL protections...', pct: 62, delay: 750 },
          { text: `Setting up ${selectedPMs.join(', ')}...`, pct: 80, delay: 900 },
          { text: 'Installing bootstrap & ElleKit...', pct: 92, delay: 750 },
          { text: 'Finalizing environment...', pct: 100, delay: 600 }
        ];

        for (let i = 0; i < stageList.length; i++) {
          const st = stageList[i];
          setSteps((prev) => [...prev, { label: st.text, done: false }]);

          // Smooth incremental percent climb
          const startP = i === 0 ? 0 : stageList[i - 1].pct;
          const increments = 6;
          for (let stepIdx = 1; stepIdx <= increments; stepIdx++) {
            await sleep(st.delay / increments);
            setProgress(Math.round(startP + ((st.pct - startP) * stepIdx) / increments));
          }

          setSteps((prev) =>
            prev.map((item, idx) => (idx === i ? { ...item, done: true } : item))
          );
        }

        await sleep(450);

        if (jbSettings.verboseLogs) {
          setScreen('verbose');
          setVerboseLogs([]);
          const logs = [
            '[ 0.000000] Booting Endorphin 2.1.4 virtual kernel',
            '[ 0.241000] cpu0: Apple A18 Pro simulation online',

        runningRef.current = false;
        onJailbreakSuccess(selectedPMs);

              <div className="my-auto w-full flex flex-col items-center">

                    <polyline points="20 6 9 17 4 12" />

                </div>

                <h2 className="text-[22px] font-bold tracking-tight">Jailbreak Completed!</h2>
                <p className="text-[12.5px] text-white/70 mt-1">
                  Выбранные менеджеры пакетов добавлены на рабочий стол iPhone.
                </p>

                <div className="w-full bg-black/25 border border-white/10 rounded-2xl p-3 mt-4 space-y-2 text-[12.5px] text-left">
                  <div className="flex justify-between">
                    <span className="text-white/55">Статус</span>
                    <span className="font-semibold text-emerald-400">Jailbroken</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-white/55">Установлено на экран</span>

                  <div className="flex justify-between">
                    <span className="text-white/55">Время выполнения</span>
                    <span className="font-mono-code text-white/90">{elapsedTime}</span>

              <div className="w-full space-y-2 pt-3">
                <button

          {/* MODAL: PACKAGE MANAGER MULTI-SELECTOR */}
          {activeModal === 'pm' && (
            <div className="absolute inset-0 z-30 bg-black/65 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full bg-[#1c1315] border border-white/15 rounded-[26px] p-4 shadow-2xl">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-[17px] font-bold">Package Managers</h3>
                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-sm"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-[12px] text-white/60 mb-3.5">
                  Выберите один или несколько менеджеров. Они появятся на домашнем экране после завершения джейлбрейка.
                </p>

                <div className="grid grid-cols-2 gap-2.5">
                  {['Sileo', 'Zebra', 'Cydia', 'Installer'].map((pm) => {
                    const active = selectedPMs.includes(pm);
                    return (
                      <button
                        key={pm}
                        onClick={() => togglePM(pm)}
                        className={`p-3 rounded-2xl border flex flex-col items-center gap-2 transition-all ${
                          active
                            ? 'bg-white/15 border-white/70 scale-[1.02]'
                            : 'bg-white/[0.05] border-white/10 opacity-75'
                        }`}
                      >
                        <AppIconArtwork appId={pm} size="sm" />
                        <div className="flex items-center gap-1.5">
                          <span className="text-[13.5px] font-semibold">{pm}</span>
                          <span
                            className={`w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold ${
                              active ? 'bg-white text-black' : 'border border-white/40 text-transparent'
                            }`}
                          >
                            ✓
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>

                <button
                  onClick={() => setActiveModal(null)}
                  className="mt-4 w-full py-3 rounded-2xl bg-white text-black font-semibold text-[14.5px] active:scale-95 transition-transform"
                >
                  Сохранить выбор ({selectedPMs.length})
                </button>
              </div>
            </div>
          )}

          {/* MODAL: SETTINGS */}
          {activeModal === 'settings' && (
            <div className="absolute inset-0 z-30 bg-black/65 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full bg-[#1c1315] border border-white/15 rounded-[26px] p-4 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-[17px] font-bold">Endorphin Settings</h3>
                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-white/[0.06] border border-white/10 rounded-2xl overflow-hidden divide-y divide-white/10">
                  {[
                    { key: 'tweakInjection', title: 'Tweak Injection', sub: 'Загружать ElleKit и твики' },
                    { key: 'verboseLogs', title: 'Verbose Logs', sub: 'Консоль загрузки при респринге' },
                    { key: 'developerMode', title: 'Developer Mode', sub: 'Расширенная диагностика симулятора' }
                  ].map((item) => (
                    <div key={item.key} className="px-3.5 py-3 flex items-center justify-between">
                      <div>
                        <div className="text-[14px] font-medium">{item.title}</div>
                        <div className="text-[11px] text-white/50">{item.sub}</div>
                      </div>
                      <button
                        onClick={() =>
                          setJbSettings((prev) => ({ ...prev, [item.key]: !prev[item.key] }))
                        }
                        className={`w-12 h-7 rounded-full p-0.5 transition-colors ${
                          jbSettings[item.key] ? 'bg-emerald-500' : 'bg-white/20'
                        }`}
                      >
                        <div
                          className={`w-6 h-6 rounded-full bg-white transition-transform ${
                            jbSettings[item.key] ? 'translate-x-5' : 'translate-x-0'
                          }`}
                        />
                      </button>
                    </div>
                  ))}
                </div>

                {isJailbroken && (
                  <button
                    onClick={() => {
                      onResetJailbreak();
                      setActiveModal(null);
                    }}
                    className="w-full py-3 rounded-2xl bg-red-500/20 border border-red-500/30 text-red-300 font-semibold text-[13.5px] active:scale-95 transition-transform"
                  >

          {/* MODAL: CREDITS */}

                <div className="flex items-center justify-between">
                  <h3 className="text-[17px] font-bold">Endorphin 2.1.4 — Credits</h3>
                  <button
                    onClick={() => setActiveModal(null)}
                    className="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-sm"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-[12.5px] text-white/75 leading-relaxed">
                  <strong>Endorphin</strong> — это безопасный визуальный симулятор iOS-джейлбрейка и магазинов твиков (Sileo, Zebra, Cydia, Installer). Никаких реальных изменений системы iOS не производится.
                </p>
                <div className="flex flex-wrap gap-2 pt-1">
                  <span className="px-3 py-1.5 rounded-xl bg-white/10 text-[12px] font-medium">iPhone X+ Gesture Engine</span>
                  <span className="px-3 py-1.5 rounded-xl bg-white/10 text-[12px] font-medium">PWA Standalone Ready</span>

    /* =========================================================================
       8. PACKAGE MANAGER STORES (SILEO, ZEBRA, CYDIA, INSTALLER)
    ========================================================================= */
    function PackageManagerApp({
      storeName,
      repos,
      setRepos,
      installedTweaks,
      onInstallTweak,
      onRemoveTweak
    }) {
      const [activeTab, setActiveTab] = useState('featured'); // 'featured' | 'sources' | 'packages' | 'installed' | 'search'
      const [selectedTweak, setSelectedTweak] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [newRepoUrl, setNewRepoUrl] = useState('');
      const [isRefreshing, setIsRefreshing] = useState(false);

      // Installation / Removal Queue Modal State
      const [queueTask, setQueueTask] = useState(null); // { type: 'install'|'remove', tweak, progress, logs, done }

      // Authentic Theme Palettes per Store
      const storeTheme = useMemo(() => {
        switch (storeName) {
          case 'Sileo':
            return {
              accentText: 'text-cyan-400',
              accentBg: 'bg-cyan-500',
              headerBg: 'bg-[#0f1318]',
              cardBg: 'bg-[#181f26]',
              subtitle: 'Modern APT Package Manager'
            };
          case 'Zebra':
            return {
              accentText: 'text-indigo-400',
              accentBg: 'bg-indigo-500',
              headerBg: 'bg-[#121216]',
              cardBg: 'bg-[#1c1c22]',
              subtitle: 'Fast & Lightweight Package Manager'
            };
          case 'Cydia':
            return {
              accentText: 'text-amber-400',
              accentBg: 'bg-amber-600',
              headerBg: 'bg-[#1c1510]',
              cardBg: 'bg-[#261d17]',
              subtitle: 'Classic APT Frontend • Telesphoreo'
            };
          default:
            return {
              accentText: 'text-blue-400',
              accentBg: 'bg-blue-600',
              headerBg: 'bg-[#0f141d]',
              cardBg: 'bg-[#171f2e]',
              subtitle: 'Installer 5 • Next-Gen Repository Client'
            };
        }
      }, [storeName]);

      const runTweakOperation = async (type, tweak) => {
        setQueueTask({
          type,
          tweak,
          progress: 10,
          logs: [`Preparing to ${type} ${tweak.name} (${tweak.version})...`],
          done: false
        });

        const stages =
          type === 'install'
            ? [
                { p: 35, msg: `Fetching ${tweak.id}_${tweak.version}_iphoneos-arm64.deb from ${tweak.repo}...` },
                { p: 65, msg: 'Verifying SHA256 checksum & dependencies...' },
                { p: 88, msg: 'Unpacking files into virtual /var/jb/Library/MobileSubstrate...' },
                { p: 100, msg: `Installed ${tweak.name} successfully!` }
              ]
            : [
                { p: 45, msg: `Removing ${tweak.id} virtual files...` },
                { p: 80, msg: 'Updating dpkg status database...' },
                { p: 100, msg: `Removed ${tweak.name} successfully!` }
              ];

        for (const st of stages) {
          await new Promise((r) => setTimeout(r, 420));
          setQueueTask((prev) =>
            prev
              ? {
                  ...prev,
                  progress: st.p,
                  logs: [...prev.logs, st.msg],
                  done: st.p === 100
                }
              : null
          );
        }

        if (type === 'install') {
          onInstallTweak(tweak.id);
        } else {
          onRemoveTweak(tweak.id);
        }
      };

      const handleAddRepo = (e) => {
        e.preventDefault();
        const trimmed = newRepoUrl.trim();
        if (!trimmed) return;
        const cleanUrl = trimmed.startsWith('http') ? trimmed : `https://${trimmed}`;
        const hostName = cleanUrl.replace(/^https?:\/\//, '').split('/')[0];
        const newEntry = {
          id: `repo-${Date.now()}`,
          name: hostName,
          url: cleanUrl,
          packagesCount: Math.floor(Math.random() * 120) + 15,
          iconColor: '#06b6d4'
        };
        setRepos((prev) => [newEntry, ...prev]);
        setNewRepoUrl('');
      };

      const handleRefreshRepos = () => {
        setIsRefreshing(true);
        setTimeout(() => setIsRefreshing(false), 750);
      };

      const filteredSearch = TWEAKS_CATALOG.filter(
        (t) =>
          t.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.shortDesc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.author.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const installedList = TWEAKS_CATALOG.filter((t) => installedTweaks.includes(t.id));

      return (
        <div className={`w-full h-full ${storeTheme.headerBg} text-white flex flex-col justify-between overflow-hidden relative`}>
          {/* Store Top Bar */}
          <div className="px-4 pt-2 pb-2.5 border-b border-white/10 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-2.5">
              <AppIconArtwork appId={storeName} size="sm" />
              <div>
                <h1 className="text-[20px] font-bold leading-tight">{storeName}</h1>
                <p className="text-[11px] text-white/50">{storeTheme.subtitle}</p>
              </div>
            </div>
            <span className={`px-2.5 py-1 rounded-full bg-white/10 text-[11px] font-semibold ${storeTheme.accentText}`}>
              Rootless
            </span>
          </div>

          {/* Main Tab Content */}
          <div className="scroll-area flex-1 px-4 py-3 space-y-4">
            {/* TAB 1: FEATURED */}
            {activeTab === 'featured' && (
              <>
                <div>
                  <h2 className="text-[16px] font-bold mb-2.5">Рекомендуемые твики</h2>
                  <div className="space-y-3">
                    {TWEAKS_CATALOG.filter((t) => t.featured).map((tweak) => {
                      const isInst = installedTweaks.includes(tweak.id);
                      return (
                        <div
                          key={tweak.id}
                          onClick={() => setSelectedTweak(tweak)}
                          className={`rounded-[22px] bg-gradient-to-br ${tweak.bannerGradient} p-4 shadow-lg cursor-pointer active:scale-[0.98] transition-transform`}
                        >
                          <div className="flex items-center justify-between">
                            <span className="px-2 py-0.5 rounded-md bg-black/30 text-[10px] font-semibold uppercase tracking-wider">
                              {tweak.category}
                            </span>
                            <span className="text-[11px] text-white/80 font-mono-code">v{tweak.version}</span>
                          </div>
                          <div className="mt-3 flex items-center justify-between gap-3">
                            <div>
                              <h3 className="text-[18px] font-bold">{tweak.name}</h3>
                              <p className="text-[12px] text-white/85 line-clamp-2 mt-0.5">{tweak.shortDesc}</p>
                            </div>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                if (!isInst) runTweakOperation('install', tweak);
                                else setSelectedTweak(tweak);
                              }}
                              className="px-3.5 py-1.5 rounded-full bg-white text-black text-[12px] font-bold shrink-0"
                            >
                              {isInst ? 'Открыть' : 'Get'}
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div>
                  <h2 className="text-[16px] font-bold mb-2">Новые поступления</h2>
                  <div className={`${storeTheme.cardBg} rounded-2xl border border-white/10 divide-y divide-white/10`}>
                    {TWEAKS_CATALOG.slice(3, 7).map((tweak) => (
                      <div
                        key={tweak.id}
                        onClick={() => setSelectedTweak(tweak)}
                        className="p-3 flex items-center justify-between gap-3 cursor-pointer active:bg-white/5"
                      >
                        <div className={`w-10 h-10 rounded-xl ${tweak.iconBg} flex items-center justify-center font-bold text-white shrink-0`}>
                          {tweak.name[0]}
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="text-[14px] font-semibold truncate">{tweak.name}</div>
                          <div className="text-[11.5px] text-white/55 truncate">{tweak.shortDesc}</div>
                        </div>
                        <span className={`text-[12px] font-semibold ${storeTheme.accentText}`}>
                          {installedTweaks.includes(tweak.id) ? 'Installed' : 'Get'}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </>
            )}

            {/* TAB 2: SOURCES */}
            {activeTab === 'sources' && (
              <div className="space-y-3.5">
                <div className="flex items-center justify-between">
                  <h2 className="text-[17px] font-bold">Источники ({repos.length})</h2>
                  <button
                    onClick={handleRefreshRepos}
                    className={`px-3 py-1 rounded-full bg-white/10 text-[12px] font-semibold ${storeTheme.accentText} active:scale-95`}
                  >
                    {isRefreshing ? 'Обновление...' : 'Обновить'}
                  </button>
                </div>

                {/* Add Repo Form */}
                <form onSubmit={handleAddRepo} className="flex gap-2">
                  <input
                    type="text"
                    value={newRepoUrl}
                    onChange={(e) => setNewRepoUrl(e.target.value)}
                    placeholder="https://repo.example.com"
                    className="flex-1 px-3.5 py-2.5 rounded-xl bg-white/10 border border-white/15 text-[13px] text-white placeholder-white/40 outline-none"
                  />
                  <button
                    type="submit"
                    className={`px-4 py-2.5 rounded-xl ${storeTheme.accentBg} text-white text-[13px] font-semibold active:scale-95`}
                  >
                    Добавить
                  </button>
                </form>

                <div className={`${storeTheme.cardBg} rounded-2xl border border-white/10 divide-y divide-white/10`}>
                  {repos.map((repo) => (
                    <div key={repo.id} className="p-3.5 flex items-center justify-between gap-3">
                      <div
                        className="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-white shrink-0"
                        style={{ backgroundColor: repo.iconColor }}
                      >
                        {repo.name[0].toUpperCase()}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-[14px] font-semibold truncate">{repo.name}</div>
                        <div className="text-[11px] text-white/50 truncate">{repo.url}</div>
                      </div>
                      <button
                        onClick={() => setRepos((prev) => prev.filter((r) => r.id !== repo.id))}
                        className="px-2.5 py-1 rounded-lg bg-red-500/15 text-red-400 text-[11px] font-semibold active:scale-95"
                      >
                        Удалить
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: PACKAGES */}
            {activeTab === 'packages' && (
              <div className="space-y-2.5">
                <h2 className="text-[17px] font-bold">Все пакеты ({TWEAKS_CATALOG.length})</h2>
                <div className={`${storeTheme.cardBg} rounded-2xl border border-white/10 divide-y divide-white/10`}>
                  {TWEAKS_CATALOG.map((tweak) => {
                    const isInst = installedTweaks.includes(tweak.id);
                    return (
                      <div
                        key={tweak.id}
                        onClick={() => setSelectedTweak(tweak)}
                        className="p-3.5 flex items-center justify-between gap-3 cursor-pointer active:bg-white/5"
                      >
                        <div className={`w-11 h-11 rounded-xl ${tweak.iconBg} flex items-center justify-center font-bold text-[16px] shrink-0`}>
                          {tweak.name[0]}
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2">
                            <span className="text-[14.5px] font-semibold truncate">{tweak.name}</span>
                            <span className="text-[11px] font-mono-code text-white/45">{tweak.version}</span>
                          </div>
                          <div className="text-[12px] text-white/60 truncate">{tweak.shortDesc}</div>
                        </div>
                        {isInst && (
                          <span className="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 text-[10.5px] font-semibold">
                            ✓
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 4: INSTALLED */}
            {activeTab === 'installed' && (
              <div className="space-y-3">
                <h2 className="text-[17px] font-bold">Установленные ({installedList.length})</h2>
                {installedList.length === 0 ? (
                  <div className="py-14 text-center text-white/50 text-[13.5px]">
                    У вас пока нет виртуально установленных твиков. Откройте раздел «Featured» или «Packages».
                  </div>
                ) : (
                  <div className={`${storeTheme.cardBg} rounded-2xl border border-white/10 divide-y divide-white/10`}>
                    {installedList.map((tweak) => (
                      <div key={tweak.id} className="p-3.5 flex items-center justify-between gap-3">
                        <div
                          onClick={() => setSelectedTweak(tweak)}
                          className="flex items-center gap-3 flex-1 min-w-0 cursor-pointer"
                        >
                          <div className={`w-10 h-10 rounded-xl ${tweak.iconBg} flex items-center justify-center font-bold shrink-0`}>
                            {tweak.name[0]}
                          </div>
                          <div className="min-w-0">
                            <div className="text-[14px] font-semibold truncate">{tweak.name}</div>
                            <div className="text-[11px] text-emerald-400 font-medium">
                              Installed • v{tweak.version}
                            </div>
                          </div>
                        </div>
                        <button
                          onClick={() => runTweakOperation('remove', tweak)}
                          className="px-3 py-1.5 rounded-xl bg-red-500/20 border border-red-500/30 text-red-300 text-[12px] font-semibold active:scale-95"
                        >
                          Remove
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 5: SEARCH */}
            {activeTab === 'search' && (
              <div className="space-y-3">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Поиск твиков, авторов, описаний..."
                  className="w-full px-3.5 py-2.5 rounded-xl bg-white/10 border border-white/15 text-[13.5px] text-white placeholder-white/45 outline-none"
                />
                <div className={`${storeTheme.cardBg} rounded-2xl border border-white/10 divide-y divide-white/10`}>
                  {filteredSearch.length === 0 ? (
                    <div className="p-6 text-center text-white/45 text-[13px]">Ничего не найдено</div>
                  ) : (
                    filteredSearch.map((tweak) => (
                      <div
                        key={tweak.id}
                        onClick={() => setSelectedTweak(tweak)}
                        className="p-3.5 flex items-center justify-between gap-3 cursor-pointer active:bg-white/5"
                      >
                        <div className={`w-10 h-10 rounded-xl ${tweak.iconBg} flex items-center justify-center font-bold shrink-0`}>
                          {tweak.name[0]}

    /* =========================================================================
       10. MAIN ROOT APPLICATION & GESTURE ENGINE
    ========================================================================= */
    const STORAGE_KEY = 'iphone_jb_simulator_state_v1';

    function App() {
      // Load saved progress from localStorage
      const loadInitial = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
      };

      const saved = useMemo(() => loadInitial(), []);

      // PWA Standalone Check
      const [showInstallGuide, setShowInstallGuide] = useState(() => {
        const isStandalone =
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;
        return !isStandalone && !(saved && saved.guideDismissed);
      });

      // Core OS State
      const [isLocked, setIsLocked] = useState(true);
      const [activeApp, setActiveApp] = useState(null);
      const [openApps, setOpenApps] = useState(['endorphin']);
      const [isSwitcherOpen, setIsSwitcherOpen] = useState(false);
      const [isControlCenterOpen, setIsControlCenterOpen] = useState(false);
      const [isNotificationCenterOpen, setIsNotificationCenterOpen] = useState(false);

      // Jailbreak & Package Managers Progress State
      const [isJailbroken, setIsJailbroken] = useState(saved?.isJailbroken ?? false);
      const [selectedPMs, setSelectedPMs] = useState(saved?.selectedPMs ?? ['Sileo']);
      const [installedPMs, setInstalledPMs] = useState(saved?.installedPMs ?? []);
      const [newlyInstalledPMs, setNewlyInstalledPMs] = useState([]);
      const [installedTweaks, setInstalledTweaks] = useState(saved?.installedTweaks ?? ['ellekit']);
      const [repos, setRepos] = useState(saved?.repos ?? DEFAULT_REPOS);
      const [jbSettings, setJbSettings] = useState(
        saved?.jbSettings ?? {
          tweakInjection: true,
          verboseLogs: true,
          developerMode: false
        }
      );

      // Control Center & Notifications State
      const [controlState, setControlState] = useState({
        airplane: false,
        cellular: true,
        wifi: true,
        bluetooth: true,
        flashlight: false,
        lowPower: false,
        rotationLock: false,
        dnd: false,
        playing: false,
        brightness: 88,
        volume: 65
      });

      const [notifications, setNotifications] = useState(
        saved?.notifications ?? [
          {
            id: 'welcome-1',
            appId: 'endorphin',
            title: 'Endorphin 2.1.4',
            body: 'Разблокируйте iPhone свайпом вверх и откройте Endorphin для симуляции джейлбрейка.',
            time: 'сейчас'
          }
        ]
      );

      // Live iOS Clock
      const [now, setNow] = useState(() => new Date());
      useEffect(() => {
        initPWAManifest();
        const timer = setInterval(() => setNow(new Date()), 10000);
        return () => clearInterval(timer);
      }, []);

      const timeStr = useMemo(
        () => now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
        [now]
      );
      const dateStr = useMemo(
        () => now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }),
        [now]
      );

      // Persist State in localStorage
      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              isJailbroken,
              selectedPMs,
              installedPMs,
              installedTweaks,
              repos,
              jbSettings,
              notifications,
              guideDismissed: !showInstallGuide
            })
          );
        } catch (e) {}
      }, [isJailbroken, selectedPMs, installedPMs, installedTweaks, repos, jbSettings, notifications, showInstallGuide]);

      const addNotification = useCallback((title, body, appId = 'endorphin') => {
        const timeLabel = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        setNotifications((prev) => [
          { id: `${Date.now()}-${Math.random()}`, appId, title, body, time: timeLabel },
          ...prev.slice(0, 14)
        ]);
      }, []);

      // App Lifecycle Handlers
      const openApp = (appId) => {
        setIsLocked(false);
        setIsSwitcherOpen(false);
        setIsControlCenterOpen(false);
        setIsNotificationCenterOpen(false);
        setActiveApp(appId);
        setOpenApps((prev) => (prev.includes(appId) ? prev : [...prev, appId]));
      };

      const goHome = () => {
        setActiveApp(null);
        setIsSwitcherOpen(false);
        setIsControlCenterOpen(false);
        setIsNotificationCenterOpen(false);
      };

      const closeAppFromSwitcher = (appId) => {
        setOpenApps((prev) => prev.filter((id) => id !== appId));
        if (activeApp === appId) setActiveApp(null);
      };

      // Jailbreak Completion Callback -> Installs selected Package Managers onto Home Screen
      const handleJailbreakSuccess = (chosenPMs) => {
        setIsJailbroken(true);
        setInstalledPMs((prev) => {
          const merged = Array.from(new Set([...prev, ...chosenPMs]));
          return merged;
        });
        setNewlyInstalledPMs(chosenPMs);
        setOpenApps((prev) => Array.from(new Set([...prev, ...chosenPMs])));

        addNotification(
          'Jailbreak Completed!',
          `Добавлены менеджеры пакетов: ${chosenPMs.join(', ')}. Вернитесь на рабочий стол.`,
          'endorphin'
        );

        setTimeout(() => setNewlyInstalledPMs([]), 4500);
      };

      const handleResetJailbreak = () => {
        setIsJailbroken(false);
        setInstalledPMs([]);
        setNewlyInstalledPMs([]);
        addNotification('Endorphin', 'Состояние Jailbreak сброшено до заводского.', 'endorphin');
      };

      const handleResetAllProgress = () => {
        localStorage.removeItem(STORAGE_KEY);
        setIsJailbroken(false);
        setSelectedPMs(['Sileo']);
        setInstalledPMs([]);
        setInstalledTweaks(['ellekit']);
        setRepos(DEFAULT_REPOS);
        setActiveApp(null);
        setIsLocked(true);
        addNotification('Система', 'Симулятор iPhone сброшен к начальному состоянию.', 'settings');
      };

      /* -----------------------------------------------------------------------
         BOTTOM HOME BAR & TOP EDGE GESTURE RECOGNITION
      ----------------------------------------------------------------------- */
      const bottomGestureRef = useRef({ startX: 0, startY: 0, startTime: 0, active: false });

      const onBottomBarStart = (clientX, clientY) => {
        bottomGestureRef.current = {
          startX: clientX,
          startY: clientY,
          startTime: Date.now(),
          active: true
        };
      };

      const onBottomBarEnd = (clientX, clientY) => {
        const g = bottomGestureRef.current;
        if (!g.active) return;
        g.active = false;

        const dx = clientX - g.startX;
        const dy = g.startY - clientY; // positive = swipe up
        const duration = Date.now() - g.startTime;

        // 1. Horizontal Swipe along Home Indicator -> Switch between open apps
        if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) && openApps.length > 0) {
          const currentIdx = activeApp ? openApps.indexOf(activeApp) : -1;
          if (dx < 0) {
            const nextIdx = (currentIdx + 1) % openApps.length;
            openApp(openApps[nextIdx]);
          } else {
            const prevIdx = currentIdx <= 0 ? openApps.length - 1 : currentIdx - 1;
            openApp(openApps[prevIdx]);
          }
          return;
        }

        // 2. Swipe Up from Bottom -> Hold opens App Switcher, Quick Swipe goes Home
        if (dy > 35) {
          if (duration > 340) {
            setIsSwitcherOpen(true);
          } else {
            goHome();
          }
          return;
        }

        // 3. Tap on Home Indicator -> Go Home
        goHome();
      };

      /* -----------------------------------------------------------------------
         PWA INSTALL GUIDE VIEW (If opened in normal Safari browser)
      ----------------------------------------------------------------------- */
      if (showInstallGuide) {
        return (
          <div className="w-full h-full endorphin-bg text-white flex flex-col justify-between px-5 py-6 overflow-y-auto">
            <div className="max-w-[390px] w-full mx-auto my-auto space-y-5">
              <div className="flex flex-col items-center text-center">
                <AppIconArtwork appId="endorphin" size="lg" />
                <span className="mt-3 px-3 py-0.5 rounded-full bg-white/15 text-[11px] font-semibold">
                  PWA • iPhone X+ Simulator
                </span>
                <h1 className="text-[26px] font-bold mt-2">Установите на экран «Домой»</h1>
                <p className="text-[13px] text-white/75 mt-1">
                  Чтобы виртуальный iPhone открывался на весь экран без панели Safari, добавьте веб-приложение на рабочий стол:
                </p>
              </div>

              <div className="glass-card rounded-[24px] p-4 space-y-3 text-[13.5px]">
                <div className="flex items-center gap-3">
                  <span className="w-7 h-7 rounded-full bg-white/15 flex items-center justify-center font-bold shrink-0">1</span>
                  <span>Нажмите кнопку <strong>«Поделиться»</strong> в нижней панели Safari.</span>
                </div>
                <div className="h-[1px] bg-white/10 ml-10" />
                <div className="flex items-center gap-3">
                  <span className="w-7 h-7 rounded-full bg-white/15 flex items-center justify-center font-bold shrink-0">2</span>
                  <span>Выберите пункт <strong>«На экран Домой»</strong>.</span>
                </div>
                <div className="h-[1px] bg-white/10 ml-10" />
                <div className="flex items-center gap-3">
                  <span className="w-7 h-7 rounded-full bg-white/15 flex items-center justify-center font-bold shrink-0">3</span>
                  <span>Подтвердите нажатием <strong>«Добавить»</strong>.</span>
                </div>
                <div className="h-[1px] bg-white/10 ml-10" />
                <div className="flex items-center gap-3">
                  <span className="w-7 h-7 rounded-full bg-white/15 flex items-center justify-center font-bold shrink-0">4</span>
                  <span>Откройте иконку <strong>Endorphin</strong> с домашнего экрана.</span>
                </div>
              </div>

              <button
                onClick={() => setShowInstallGuide(false)}
                className="w-full py-3.5 rounded-2xl bg-white text-black font-semibold text-[15px] shadow-xl active:scale-95 transition-transform"
              >
                Запустить симулятор в браузере
              </button>
            </div>
          </div>
        );
      }

      /* -----------------------------------------------------------------------
         VIRTUAL IPHONE X+ CHASSIS & SCREEN
      ----------------------------------------------------------------------- */
      return (
        <div className="w-full h-full bg-[#050507] flex items-center justify-center sm:p-3 overflow-hidden">
          {/* iPhone Outer Frame (Full-bleed on mobile, realistic bezel on desktop) */}
          <div className="relative w-full h-full sm:max-w-[402px] sm:max-h-[852px] sm:rounded-[52px] sm:border-[10px] sm:border-[#1f1f24] sm:shadow-[0_25px_70px_rgba(0,0,0,0.85)] overflow-hidden ios-wallpaper flex flex-col justify-between">
            {/* Screen Brightness Overlay */}
            <div
              className="absolute inset-0 bg-black pointer-events-none z-50 transition-opacity duration-150"
              style={{ opacity: Math.max(0, (100 - controlState.brightness) / 140) }}
            />

            {/* Flashlight Beam Effect */}
            {controlState.flashlight && (
              <div className="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-white/25 to-transparent pointer-events-none z-30" />
            )}

            {/* Top iOS Status Bar */}
            <StatusBar
              timeStr={timeStr}
              controlState={controlState}
              onPullLeft={() => {
                setIsControlCenterOpen(false);
                setIsNotificationCenterOpen(true);
              }}
              onPullRight={() => {
                setIsNotificationCenterOpen(false);
                setIsControlCenterOpen(true);
              }}
            />

            {/* Main Interactive Viewport */}
            <div className="relative flex-1 flex flex-col overflow-hidden">
              {isLocked ? (
                <LockScreen
                  timeStr={timeStr}
                  dateStr={dateStr}
                  notifications={notifications}
                  controlState={controlState}
                  setControlState={setControlState}
                  onUnlock={() => setIsLocked(false)}
                  onOpenCamera={() => openApp('camera')}
                />
              ) : (
                <>
                  {/* Home Screen Layer */}
                  <HomeScreen
                    installedPMs={installedPMs}
                    newlyInstalledPMs={newlyInstalledPMs}
                    installedTweaksCount={installedTweaks.length}
                    isJailbroken={isJailbroken}
                    onOpenApp={openApp}
                    onOpenControlCenter={() => setIsControlCenterOpen(true)}
                    onLockScreen={() => {
                      goHome();
                      setIsLocked(true);
                    }}
                  />

                  {/* Active Foreground Application Layer */}
                  {activeApp && (
                    <div className="absolute inset-0 z-10 bg-black flex flex-col justify-between animate-app-open overflow-hidden">
                      <div className="flex-1 overflow-hidden">
                        {activeApp === 'endorphin' ? (
                          <EndorphinApp
                            isJailbroken={isJailbroken}
                            selectedPMs={selectedPMs}
                            setSelectedPMs={setSelectedPMs}
                            jbSettings={jbSettings}
                            setJbSettings={setJbSettings}
                            onJailbreakSuccess={handleJailbreakSuccess}
                            onResetJailbreak={handleResetJailbreak}
                            addNotification={addNotification}
                          />
                        ) : ['Sileo', 'Zebra', 'Cydia', 'Installer'].includes(activeApp) ? (
                          <PackageManagerApp
                            storeName={activeApp}
                            repos={repos}
                            setRepos={setRepos}
                            installedTweaks={installedTweaks}
                            onInstallTweak={(tweakId) => {
                              setInstalledTweaks((prev) => Array.from(new Set([...prev, tweakId])));
                              const tw = TWEAKS_CATALOG.find((t) => t.id === tweakId);
                              if (tw) addNotification(activeApp, `Установлен твик ${tw.name} (${tw.version})`, activeApp);
                            }}
                            onRemoveTweak={(tweakId) => {
                              setInstalledTweaks((prev) => prev.filter((id) => id !== tweakId));
                              const tw = TWEAKS_CATALOG.find((t) => t.id === tweakId);
                              if (tw) addNotification(activeApp, `Удалён твик ${tw.name}`, activeApp);
                            }}
                          />
                        ) : (
                          <StockAppView
                            appId={activeApp}
                            isJailbroken={isJailbroken}
                            installedPMs={installedPMs}
                            installedTweaks={installedTweaks}
                            onResetAllProgress={handleResetAllProgress}
                          />
                        )}
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>

            {/* Bottom Home Indicator Gesture Zone (when unlocked) */}
            {!isLocked && (
              <div
                onTouchStart={(e) => onBottomBarStart(e.touches[0].clientX, e.touches[0].clientY)}
                onTouchEnd={(e) => onBottomBarEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY)}
                onMouseDown={(e) => onBottomBarStart(e.clientX, e.clientY)}
                onMouseUp={(e) => onBottomBarEnd(e.clientX, e.clientY)}
                className="relative z-30 w-full h-7 flex items-center justify-center cursor-pointer shrink-0 bg-transparent"
                title="Нажмите или смахните вверх для возврата домой; удерживайте для App Switcher"
              >
                <div className="w-36 h-1.5 rounded-full bg-white/90 shadow" />
              </div>
            )}

            {/* App Switcher Overlay */}
            <AppSwitcher
              isOpen={isSwitcherOpen}
              openApps={openApps}
              onSelectApp={openApp}
              onCloseApp={closeAppFromSwitcher}
              onCloseSwitcher={() => setIsSwitcherOpen(false)}
            />

            {/* Control Center Overlay */}
            <ControlCenter
              isOpen={isControlCenterOpen}
              onClose={() => setIsControlCenterOpen(false)}
              controlState={controlState}
              setControlState={setControlState}
            />

            {/* Notification Center Overlay */}
            <NotificationCenter
              isOpen={isNotificationCenterOpen}
              onClose={() => setIsNotificationCenterOpen(false)}
              notifications={notifications}
              onClearAll={() => setNotifications([])}
              onLockPhone={() => {
                setIsNotificationCenterOpen(false);
                goHome();
                setIsLocked(true);
              }}
              timeStr={timeStr}
              dateStr={dateStr}
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
